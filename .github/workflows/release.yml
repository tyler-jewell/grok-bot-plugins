# SHA-pinned actions. Do not switch to floating tags.
# Promote the current main head (which must have a non-expired candidate-<sha> artifact)
# to production: creates tag prod/YYYY.MM.DD+N and a GitHub Release.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type promote-staging to confirm"
        required: true
        type: string
      sha:
        description: "Commit to promote (default: current main head)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CONFIRM: ${{ inputs.confirm }}
      INPUT_SHA: ${{ inputs.sha }}
      REF: ${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Guards
        id: guards
        run: |
          set -euo pipefail
          main_head=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          sha="${INPUT_SHA:-$main_head}"
          # A candidate is proven by its artifact (named for the commit), not by a
          # staging run: workflow_run-triggered runs report the default branch head
          # as head_sha, which can be a different commit than the one built.
          artifacts=0
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            # Fails closed: an API error aborts the job (set -e) instead of counting as 0 or 1.
            artifacts=$(gh api "repos/${REPO}/actions/artifacts?name=candidate-${sha}" \
              --jq '[.artifacts[]|select(.expired==false)]|length')
            if ! [[ "$artifacts" =~ ^[0-9]+$ ]]; then
              echo "unexpected artifact count: ${artifacts}" >&2
              exit 1
            fi
          fi
          node scripts/next-tag.mjs guard --confirm "$CONFIRM" --ref "$REF" \
            --sha "$sha" --main-head "$main_head" --candidate-artifacts "$artifacts"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        env:
          SHA: ${{ steps.guards.outputs.sha }}
        # GitHub keeps at most one running and one pending run per concurrency
        # group (extra pending runs are cancelled), so concurrent promotes are not
        # fully serialised. The 422 retry below is the backstop.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --tags --force --quiet origin
            plan=$(git tag --list 'prod/*' \
              --format='%(refname:strip=2) %(if)%(*objectname)%(then)%(*objectname)%(else)%(objectname)%(end)' \
              | node scripts/next-tag.mjs plan --sha "$SHA" --date "$(date -u +%Y.%m.%d)")
            if [[ "$plan" == released=* ]]; then
              tag="${plan#released=}"
              echo "already released as ${tag}"
              # A previous run may have created the tag but not the Release.
              if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
                gh release create "$tag" --repo "$REPO" --verify-tag --generate-notes --title "$tag"
              fi
              echo "Already released as \`${tag}\` (${SHA}). Nothing created." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            tag="${plan#next=}"
            # The refs API accepts any sha, so re-check the live main head right
            # before creating the tag and abort if it moved since the guards ran.
            live_head=$(gh api "repos/${REPO}/commits/main" --jq .sha)
            if [[ "$live_head" != "$SHA" ]]; then
              echo "main moved to ${live_head} since the guards ran; refusing to tag ${SHA}" >&2
              exit 1
            fi
            # Atomic: the refs API returns 422 if the tag already exists. Retry only on 422.
            rc=0
            err=$(gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${SHA}" 2>&1 >/dev/null) || rc=$?
            if [[ "$rc" -eq 0 ]]; then
              gh release create "$tag" --repo "$REPO" --verify-tag --generate-notes --title "$tag"
              echo "Released \`${tag}\` at ${SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$err" == *"HTTP 422"* ]]; then
              echo "tag ${tag} already exists (HTTP 422, attempt ${attempt}); recomputing"
              continue
            fi
            echo "creating tag ${tag} failed (exit ${rc}): ${err}" >&2
            exit 1
          done
          echo "could not create a release tag after 3 attempts" >&2
          exit 1

  deploy:
    # Optional and pluggable: skipped unless the repo variable DEPLOY_TARGET is set.
    needs: release
    if: vars.DEPLOY_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Deploy placeholder
        run: echo "Deploy target '${DEPLOY_TARGET}' is not implemented yet."
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
