# SHA-pinned actions. Do not switch to floating tags.
# Candidate build: runs only after `check` succeeds on a push to main.
name: staging
run-name: staging ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  candidate:
    # Only a successful push-triggered check on main in this repo (not a fork PR whose
    # branch is named main).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        # No Cloudflare credentials: wrangler --dry-run only bundles locally.
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Upload candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.event.workflow_run.head_sha }}
          path: dist
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "## Staging candidate"
            echo
            echo "Candidate sha: \`${CANDIDATE_SHA}\`"
            echo "Artifact: \`candidate-${CANDIDATE_SHA}\`"
            echo
            echo "Promote with the \`release\` workflow (confirm=promote-staging) while this sha is still the head of main."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Refuse without credentials
        run: |
          set -euo pipefail
          token_present=0
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_present=1
          fi
          node scripts/require-cloudflare-credentials.mjs \
            --account-id "${CLOUDFLARE_ACCOUNT_ID:-}" \
            --token-present "$token_present"
      - name: Deploy staging
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --var "GIT_SHA:${CANDIDATE_SHA}" > deploy.out
          version=$(node scripts/read-version-id.mjs deploy.out)
          echo "version_id=${version}" >> "$GITHUB_OUTPUT"
          rm -f deploy.out
      - name: Check health sha
        run: |
          set -euo pipefail
          code=$(curl -sS -o health.json -w '%{http_code}' --max-time 30 "https://skiherd-groups.jewell-labs.com/health")
          node scripts/check-health-sha.mjs --sha "$CANDIDATE_SHA" --status "$code" --body-file health.json
          tag=$(node scripts/last-migration-tag.mjs)
          node scripts/write-staging-record.mjs \
            --sha "$CANDIDATE_SHA" \
            --version-id "${{ steps.deploy.outputs.version_id }}" \
            --migration-tag "$tag" \
            --out staging-deploy.json
          {
            echo "## Staging deploy"
            echo
            echo "Candidate sha: \`${CANDIDATE_SHA}\`"
            echo "Version id: \`${{ steps.deploy.outputs.version_id }}\`"
            echo "Migration tag: \`${tag}\`"
            echo "Health sha matched."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deploy record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-deploy-${{ github.event.workflow_run.head_sha }}
          path: staging-deploy.json
          if-no-files-found: error
