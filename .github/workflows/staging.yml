# SHA-pinned actions. Do not switch to floating tags.
# Candidate build: runs only after `check` succeeds on a push to main.
name: staging
run-name: staging ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  candidate:
    # Only a successful push-triggered check on main in this repo (not a fork PR whose
    # branch is named main).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        # No Cloudflare credentials: wrangler --dry-run only bundles locally.
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Upload candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.event.workflow_run.head_sha }}
          path: dist
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "## Staging candidate"
            echo
            echo "Candidate sha: \`${CANDIDATE_SHA}\`"
            echo "Artifact: \`candidate-${CANDIDATE_SHA}\`"
            echo
            echo "Promote with the \`release\` workflow (confirm=promote-staging) while this sha is still the head of main."
          } >> "$GITHUB_STEP_SUMMARY"
