# SHA-pinned actions. Do not switch to floating tags.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Lint action pins (every uses is a 40-hex SHA)
        run: |
          # Matches `uses: owner/repo@ref` lines in workflows. Local `./` actions
          # have no `@`, commented lines do not start with `uses:`, and a trailing
          # `# vX` comment after the SHA is allowed. Prints file:line:text on failure.
          if bad=$(grep -nE '^\s*-?\s*uses:\s*\S+@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'); then
            echo "Actions must be pinned to a full 40-hex commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Types
        run: npm run check
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          node scripts/assert-no-uncaught.mjs test.log
      - name: Dry-run staging and a rendered production config
        run: |
          # No Cloudflare credentials. groups.example.com is a dry-run hostname only.
          npx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/staging"
          node scripts/render-production-config.mjs --hostname groups.example.com --out "$RUNNER_TEMP/prod.wrangler.json"
          npx wrangler deploy --dry-run --config "$RUNNER_TEMP/prod.wrangler.json" --outdir "$RUNNER_TEMP/prod"
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
